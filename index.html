<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rafter Voxel Sandbox</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; cursor: crosshair; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: rgba(0,0,0,0.75);
        color: #fff; z-index: 10; user-select: none;
      }
      #overlay.hidden { display: none; }
      #overlay h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
      #overlay p { opacity: 0.8; margin-bottom: 1.5rem; }
      #overlay button {
        padding: 12px 32px; font-size: 1.1rem; cursor: pointer;
        background: #4ade80; border: none; border-radius: 8px; color: #111;
      }
      #overlay button:hover { background: #22c55e; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
      }
      #crosshair {
        position: absolute; top: 50%; left: 50%;
        width: 20px; height: 20px; transform: translate(-50%, -50%);
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: rgba(255,255,255,0.9);
      }
      #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
      #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
      #info {
        position: absolute; top: 12px; left: 12px; color: #fff;
        font-size: 13px; line-height: 1.6; text-shadow: 1px 1px 2px #000;
      }
      #hotbar {
        position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 4px;
      }
      .hotbar-slot {
        width: 44px; height: 44px; border: 2px solid rgba(255,255,255,0.4);
        border-radius: 4px; display: flex; align-items: center; justify-content: center;
        font-size: 11px; color: #fff; text-shadow: 1px 1px 2px #000;
      }
      .hotbar-slot.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Rafter Voxel Sandbox</h1>
      <p>点击开始 · WASD 移动 · 空格跳跃 · 左键破坏 · 右键放置 · 1-9 选方块</p>
      <button id="start-btn">进入游戏</button>
    </div>
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="info"></div>
      <div id="hotbar"></div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
