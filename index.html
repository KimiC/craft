<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Rafter Voxel Sandbox</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #1a1a2e;
        font-family: system-ui, sans-serif;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
      }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: rgba(0,0,0,0.75);
        color: #fff; z-index: 10; user-select: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #overlay.hidden { display: none; }
      #overlay h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); margin-bottom: 0.5rem; text-align: center; }
      #overlay p { opacity: 0.8; margin-bottom: 1.5rem; text-align: center; padding: 0 1rem; font-size: clamp(0.85rem, 3vw, 1rem); max-width: 90vw; }
      #overlay button {
        padding: 12px 32px; font-size: 1.1rem; cursor: pointer;
        background: #4ade80; border: none; border-radius: 8px; color: #111;
      }
      #overlay button:hover { background: #22c55e; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #crosshair {
        position: absolute; top: 50%; left: 50%;
        width: 20px; height: 20px; transform: translate(-50%, -50%);
      }
      body.mobile #crosshair { opacity: 0.6; }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: rgba(255,255,255,0.9);
      }
      #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
      #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
      #info {
        position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; color: #fff;
        font-size: 11px; line-height: 1.5; text-shadow: 1px 1px 2px #000;
      }
      #hotbar {
        position: absolute;
        bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
        left: 50%; transform: translateX(-50%);
        display: flex; gap: 3px; max-width: 96vw; overflow-x: auto;
        pointer-events: auto;
      }
      .hotbar-slot {
        flex-shrink: 0;
        width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.4);
        border-radius: 4px; display: flex; align-items: center; justify-content: center;
        font-size: 10px; color: #fff; text-shadow: 1px 1px 2px #000;
      }
      .hotbar-slot.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }

      /* Mobile touch controls */
      #mobile-controls {
        position: fixed; inset: 0; z-index: 6; pointer-events: none;
      }
      #mobile-controls.hidden { display: none; }
      #joystick {
        position: absolute;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 120px; height: 120px;
        border-radius: 50%;
        background: rgba(255,255,255,0.12);
        border: 2px solid rgba(255,255,255,0.25);
        pointer-events: auto;
        touch-action: none;
      }
      #joystick-stick {
        position: absolute; top: 50%; left: 50%;
        width: 48px; height: 48px; margin: -24px 0 0 -24px;
        border-radius: 50%;
        background: rgba(255,255,255,0.45);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      #action-buttons {
        position: absolute;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(120px, calc(100px + env(safe-area-inset-bottom)));
        display: flex; flex-direction: column; gap: 8px;
        pointer-events: auto;
      }
      .action-btn {
        min-width: 64px; padding: 10px 14px;
        border: none; border-radius: 8px;
        font-size: 13px; font-weight: 600;
        color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        touch-action: manipulation;
      }
      #btn-break { background: rgba(239, 68, 68, 0.85); }
      #btn-place { background: rgba(34, 197, 94, 0.85); }
      #btn-jump { background: rgba(59, 130, 246, 0.85); }
      #look-hint {
        position: absolute;
        right: 12px; top: 50%;
        transform: translateY(-50%);
        color: rgba(255,255,255,0.35);
        font-size: 11px;
        writing-mode: vertical-rl;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Rafter Voxel Sandbox</h1>
      <p id="overlay-hint">点击开始 · WASD 移动 · 空格跳跃 · 左键破坏 · 右键放置 · 1-9 选方块</p>
      <button id="start-btn">进入游戏</button>
    </div>
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="info"></div>
      <div id="hotbar"></div>
    </div>
    <div id="mobile-controls" class="hidden">
      <div id="joystick"><div id="joystick-stick"></div></div>
      <div id="action-buttons">
        <button type="button" class="action-btn" id="btn-break">Break</button>
        <button type="button" class="action-btn" id="btn-place">Place</button>
        <button type="button" class="action-btn" id="btn-jump">Jump</button>
      </div>
      <div id="look-hint">Drag to look →</div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
